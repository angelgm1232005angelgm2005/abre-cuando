<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abre cuando... 💌</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style type="text/tailwindcss">
@import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nanum+Pen+Script&display=swap');
@layer utilities {
 .font-handwritten { font-family: 'Nanum Pen Script', cursive; }
 .font-marker { font-family: 'Permanent Marker', cursive; }
 .bg-notebook { background-color:#fff; background-image:linear-gradient(#e1e9f0 1px,transparent 1px); background-size:100% 2rem; background-position-y:.5rem; }
}
.scrapbook-flip-enter-active,.scrapbook-flip-leave-active{transition:all .4s ease-out;backface-visibility:hidden}
.scrapbook-flip-enter-from{opacity:0;transform:rotateY(-90deg) scale(.9)}
.scrapbook-flip-leave-to{opacity:0;transform:rotateY(90deg) scale(1.1)}
</style>
</head>
<body class="bg-[#f4f1ea] min-h-screen p-2 sm:p-4 font-sans selection:bg-rose-200 overflow-x-hidden" style="background-image:url('https://www.transparenttextures.com/patterns/handmade-paper.png')">
<div id="app" class="w-full max-w-5xl mx-auto flex items-center justify-center min-h-[90vh] relative pt-8 pb-12" style="perspective:1500px">
<transition name="scrapbook-flip" mode="out-in">
<div v-if="!activeLetter" class="w-full max-w-md md:max-w-full mx-auto">
 <div class="text-center mb-10 transform -rotate-2">
  <h1 class="font-marker text-4xl sm:text-5xl text-rose-600 mb-2 drop-shadow-sm">Abre cuando...💌</h1>
  <p class="font-handwritten text-2xl sm:text-3xl text-slate-600">Una colección de notas solo para ti</p>
 </div>
 <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 relative px-4">
  <button v-for="letter in letters" :key="letter.id" @click="openLetter(letter)" class="bg-white p-5 rounded-sm shadow-lg border border-slate-100 transition-all duration-300 flex flex-col items-center text-center group origin-center active:scale-95 hover:scale-105 z-10" :style="`transform:rotate(${letter.tilt}deg);`">
   <div class="w-full h-8 bg-rose-100 rounded-t-sm border-b-2 border-dashed border-rose-300 -mt-2 mb-3"></div>
   <span class="text-4xl mb-2">{{letter.emoji}}</span>
   <span class="font-handwritten text-2xl font-bold text-slate-800 leading-tight">...{{letter.title}}</span>
  </button>
 </div>
</div>
<div v-else class="w-full max-w-4xl relative py-6 px-4 flex flex-col md:flex-row items-center justify-center gap-7 mx-auto">
 <div class="absolute top-2 left-1/2 md:left-[24%] -translate-x-1/2 w-28 h-8 bg-rose-400/80 rounded-sm shadow-md border-y-2 border-rose-500/20 rotate-1 z-30 opacity-80"></div>
 <div class="w-full max-w-md bg-notebook px-6 pt-12 pb-8 rounded-sm shadow-2xl border-l-4 border-l-rose-200 border border-slate-100 rotate-1 relative z-20">
  <div class="text-center mb-6 border-b-2 border-rose-100 pb-2">
   <span class="text-5xl mb-2 block">{{activeLetter.emoji}}</span>
   <h2 class="font-handwritten text-3xl font-bold text-rose-500 capitalize">{{activeLetter.title}}</h2>
  </div>
  <p class="font-handwritten text-3xl sm:text-4xl text-slate-800 leading-snug mb-10 min-h-[150px]">{{activeLetter.message}}</p>
  <div class="w-full flex justify-end">
   <button @click="closeLetter" class="font-handwritten text-2xl font-bold px-6 py-2 bg-slate-100 border border-slate-200 text-slate-600 rounded-sm active:bg-rose-100 active:text-rose-700 transition-colors shadow-sm">Volver</button>
  </div>
 </div>
 <div class="w-full max-w-md md:w-80 md:flex-shrink-0">
  <img :src="activeLetter.image" :alt="'Recuerdo para cuando '+activeLetter.title" class="w-full max-h-[65vh] aspect-[4/5] object-cover rounded-xl shadow-xl border-4 border-white">
  <p class="font-handwritten text-xl text-slate-600 text-center mt-3">Un recuerdo nuestro ❤️</p>
 </div>
</div>
</transition>
</div>

  <button id="music-toggle" type="button" style="margin-top:7px;width:100%;padding:10px 12px;border:0;border-radius:999px;background:#e11d48;color:white;font-weight:700;box-shadow:0 3px 10px #0002;cursor:pointer;">

  </button>
</div>

        onStateChange: function (event) {
          if (event.data === YT.PlayerState.PLAYING && !scrapbookMusicEnabled) {
            musicButton.textContent = '🎵 Activar música';
          }
        }
      }
    });
  };

  musicButton.addEventListener('click', function () {
    if (!scrapbookMusicReady || !scrapbookMusicPlayer) {
      musicButton.textContent = '⏳ Cargando canción…';
      return;
    }
    if (!scrapbookMusicEnabled) {
      scrapbookMusicPlayer.unMute();
      scrapbookMusicPlayer.setVolume(45);
      scrapbookMusicPlayer.playVideo();
      scrapbookMusicEnabled = true;
      musicButton.textContent = '🔊 Música activada';
    } else {
      scrapbookMusicPlayer.mute();
      musicButton.textContent = '🔇 Música silenciada';
      scrapbookMusicEnabled = false;
    }
  });

  const youtubeApiScript = document.createElement('script');
  youtubeApiScript.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(youtubeApiScript);
</script>
</body>
</html>
