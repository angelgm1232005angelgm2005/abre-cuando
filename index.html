<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Scrapbook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <style type="text/tailwindcss">
    @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nanum+Pen+Script&display=swap');

    @layer utilities {
      .font-handwritten { font-family: 'Nanum Pen Script', cursive; }
      .font-marker { font-family: 'Permanent Marker', cursive; }
      
      .bg-notebook {
        background-color: #fff;
        background-image: linear-gradient(#e1e9f0 1px, transparent 1px);
        background-size: 100% 2rem; /* Made lines slightly taller for mobile reading */
        background-position-y: 0.5rem;
      }
    }

    .scrapbook-flip-enter-active, .scrapbook-flip-leave-active {
      transition: all 0.4s ease-out;
      backface-visibility: hidden;
    }

    .scrapbook-flip-enter-from { opacity: 0; transform: rotateY(-90deg) scale(0.9); }
    .scrapbook-flip-leave-to { opacity: 0; transform: rotateY(90deg) scale(1.1); }
  </style>
</head>
<body class="bg-[#f4f1ea] min-h-screen p-2 sm:p-4 font-sans selection:bg-rose-200 overflow-x-hidden" style="background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');">

  <div id="app" class="w-full max-w-3xl mx-auto flex items-center justify-center min-h-[90vh] relative pt-8 pb-12" style="perspective: 1500px;">
    
    <transition name="scrapbook-flip" mode="out-in">
      
      <div v-if="!activeLetter" class="w-full max-w-md md:max-w-full mx-auto">
        
        <div class="text-center mb-10 transform -rotate-2">
          <h1 class="font-marker text-4xl sm:text-5xl text-rose-600 mb-2 drop-shadow-sm">Abre Cuando...💌</h1>
          <p class="font-handwritten text-2xl sm:text-3xl text-slate-600">Una colección de notas solo para ti</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 relative px-4">
          <button v-for="letter in letters" :key="letter.id" 
                  @click="openLetter(letter)"
                  class="bg-white p-5 rounded-sm shadow-lg border border-slate-100 transition-all duration-300 flex flex-col items-center text-center group origin-center active:scale-95 hover:scale-105 z-10"
                  :style="`transform: rotate(${letter.tilt}deg);`">
            
            <div class="w-full h-8 bg-rose-100 rounded-t-sm border-b-2 border-dashed border-rose-300 -mt-2 mb-3"></div>
            
            <span class="text-4xl mb-2">{{ letter.emoji }}</span>
            <span class="font-handwritten text-2xl font-bold text-slate-800 leading-tight">
              ...{{ letter.title }}
            </span>
          </button>
        </div>
      </div>

      <div v-else class="w-full max-w-md relative py-6 px-4 flex flex-col items-center mx-auto">
        
        <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-28 h-8 bg-rose-400/80 rounded-sm shadow-md border-y-2 border-rose-500/20 rotate-1 z-30 opacity-80"
             style="background-image: url('https://www.transparenttextures.com/patterns/diagmonds.png');">
        </div>

        <div class="w-full bg-notebook px-6 pt-12 pb-8 rounded-sm shadow-2xl border-l-4 border-l-rose-200 border border-slate-100 rotate-1 relative z-20">
          
          <div class="text-center mb-6 border-b-2 border-rose-100 pb-2">
            <span class="text-5xl mb-2 block">{{ activeLetter.emoji }}</span>
            <h2 class="font-handwritten text-3xl font-bold text-rose-500 capitalize">
              {{ activeLetter.title }}
            </h2>
          </div>
          
          <p class="font-handwritten text-3xl sm:text-4xl text-slate-800 leading-snug mb-10 min-h-[150px]">
            {{ activeLetter.message }}
          </p>
          
          <div class="w-full flex justify-end">
            <button @click="closeLetter" class="font-handwritten text-2xl font-bold px-6 py-2 bg-slate-100 border border-slate-200 text-slate-600 rounded-sm active:bg-rose-100 active:text-rose-700 transition-colors shadow-sm">
              Put Back
            </button>
          </div>
        </div>

      </div>
    </transition>

  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const activeLetter = ref(null);

        // Adjusted tilts slightly so they don't break the single-column layout on mobile

const letters = ref([
  {
    id: 1,
    emoji: "🥺",
    tilt: -2,
    title: "me extrañes",
    message: "Yo también te extraño, mi vida, pero siempre, pase el tiempo que pase, nos vamos a ver. Tenlo por seguro; haré lo que sea.",
    image: "images/extrañes.jpg"
  },
  {
    id: 2,
    emoji: "☁️",
    tilt: 1,
    title: "te sientas estresada",
    message: "Sal y tómate un respiro. Siempre estaré para lo que necesites. Intenta ignorar el estrés y evitar las malas influencias del exterior.",
    image: "images/estresada.jpg"
  },
  {
    id: 3,
    emoji: "✨",
    tilt: -1,
    title: "necesitas un empujoncito",
    message: "Los dos sabemos cuánto te esfuerzas, tanto por ti mismo como por los demás. Por eso, necesito que ahora pienses en ti y levantes la cabeza. Yo te apoyaré para que no te tropieces.",
    image: "images/animo.jpg"
  },
  {
    id: 4,
    emoji: "🥱",
    tilt: 2,
    title: "no puedas dormir más",
    message: "Cierra los ojos, cuenta ovejitas e intenta dejar a un lado las cosas que te arrastran en el día a día. Relájate y piensa que tienes gente que te quiere mucho.",
    image: "images/dormir.jpg"
  },
  {
    id: 5,
    emoji: "😂",
    tilt: -2,
    title: "necesites reír",
    message: "Eres súper torpe, y ese es un aspecto único que te hace tan especial. Me encanta tu torpeza y llegas a ser muy mona. Recuerda algunos de esos momentos tan torpes, que te sacarán una sonrisa. Y, por favor, nunca pierdas ese aspecto tan especial de ti.",
    image: "images/reir.jpg"
  },
  {
    id: 6,
    emoji: "🧸",
    tilt: 1,
    title: "necesitas un abrazo",
    message: "Si estoy junto a ti, pídemelo sin pensarlo. Pero, si no es así, llámame, que estaré junto a ti lo más rápido posible para darte el abrazo más fuerte que te hayan dado nunca.",
    image: "images/abrazo.jpg"
  }
]);

        const openLetter = (letter) => {
          activeLetter.value = letter;
          // Scroll to top automatically when opening a letter on mobile
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        const closeLetter = () => activeLetter.value = null;

        return {
          letters,
          activeLetter,
          openLetter,
          closeLetter
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
